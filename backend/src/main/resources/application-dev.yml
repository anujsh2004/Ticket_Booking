server:
  port: 8080

spring:
  application:
    name: ticket-booking-backend
  datasource:
    url: jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  seat:
    hold-ttl-minutes: 10
  waitlist:
    offer-ttl-minutes: 15
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  email:
    provider: mock
    from: noreply@ticketbooking.com
