server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ticket-booking-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ticket_booking_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:test}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Application Specific Configurations
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  seat:
    hold-ttl-minutes: ${SEAT_HOLD_TTL_MINUTES:10}
  waitlist:
    offer-ttl-minutes: ${WAITLIST_OFFER_TTL_MINUTES:15}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  email:
    provider: ${EMAIL_PROVIDER:mock}
    api-key: ${EMAIL_API_KEY:}
    from: ${EMAIL_FROM:noreply@ticketbooking.com}
