services:
  # Spring Boot Backend Web Service
  - type: web
    name: slowmo-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: slowmo-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: mock
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

databases:
  # Managed PostgreSQL Database
  - name: slowmo-postgres
    plan: free
    region: singapore
    databaseName: ticket_booking_db
    user: slowmo_user

